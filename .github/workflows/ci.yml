name: CI

# Runs on every push and pull request: static checks, catalog schema
# validation, workflow linting, and the unit-test suite. This is separate
# from compat-check.yml, which installs the latest herdr release and checks
# real-world compatibility on a weekly schedule — see
# docs/design/command-catalog.md, "Verification".
on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1, pinned to its release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Install actionlint
        run: |
          # actionlint's own download-actionlint.bash does NOT verify a
          # checksum (checked 2026-08-16: it curls the release tarball and
          # extracts it, nothing more) — so this downloads the release
          # tarball and its published checksums.txt directly and verifies
          # with sha256sum -c instead of using that script.
          version=1.7.12
          asset="actionlint_${version}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -fsSLO "$base_url/$asset"
          curl -fsSLO "$base_url/actionlint_${version}_checksums.txt"
          grep -F -- "$asset" "actionlint_${version}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$asset" -C "$RUNNER_TEMP/bin" actionlint
          rm -f "$asset" "actionlint_${version}_checksums.txt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # fetch-or-build.sh is /bin/sh, not bash: herdr runs it through
      # /bin/sh at install time, so it is parsed by the same shell here.
      - name: shell syntax check
        run: |
          bash -n scripts/check-compat.sh
          bash -n scripts/check-coverage.sh
          bash -n tests/stubs/herdr
          sh -n scripts/fetch-or-build.sh

      - name: shellcheck
        run: shellcheck scripts/check-compat.sh scripts/check-coverage.sh scripts/fetch-or-build.sh tests/stubs/herdr

      - name: actionlint
        run: actionlint .github/workflows/ci.yml .github/workflows/compat-check.yml .github/workflows/release.yml

      - name: Validate the schema itself
        run: check-jsonschema --check-metaschema commands.schema.json

      - name: Validate commands.json against the schema
        run: check-jsonschema --schemafile commands.schema.json commands.json

      # The palette binary. The runner image's preinstalled stable toolchain
      # is used on purpose: no third-party action to pin, and the weekly
      # image refresh doubles as a newer-stable compatibility check.
      - name: Rust toolchain in use
        run: |
          rustc --version
          cargo --version

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # tests/palette.bats drives this binary (headless mode), so the build
      # must precede bats.
      - name: cargo build --release
        run: cargo build --release

      - name: bats
        run: bats tests/
