name: herdr compatibility check

# Runs scripts/check-compat.sh and scripts/check-coverage.sh against the
# latest herdr release, so a herdr CLI change that breaks commands.json — or
# a new herdr key action nobody has classified — is caught even when nobody
# is actively working on this repo. See docs/design/command-catalog.md,
# section "Compatibility checks".
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-compat:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1, pinned to its release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install herdr
        # Left unpinned intentionally: testing compatibility against
        # whatever herdr currently ships as its latest release IS the point
        # of this weekly job, unlike check-jsonschema below.
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          # install.sh's default install dir; see $HOME/.local/bin in the
          # script (overridable via HERDR_INSTALL_DIR, not set here).
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install check-jsonschema
        # Pinned to the version validated locally (0.38.0) so a
        # check-jsonschema release change can't itself flip this job red.
        run: pipx install check-jsonschema==0.38.0

      - name: Run compatibility and coverage checks
        id: check
        # Both run unconditionally, so one failure never hides the other's
        # result in the issue body.
        run: |
          rc=0
          bash scripts/check-compat.sh >compat.txt 2>&1 || rc=1
          bash scripts/check-coverage.sh >coverage.txt 2>&1 || rc=1
          cat compat.txt coverage.txt | tee result.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Open or update issue on failure
        # always(): the previous step intentionally fails (exit 1) so the
        # run shows red; without always() here, this step's implicit
        # success() check would skip it whenever that happens.
        if: always() && steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          title_search="herdr compatibility check failed"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "$title_search in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body-file result.txt
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$title_search ($(date -u +%Y-%m-%d))" \
              --body-file result.txt
          fi
