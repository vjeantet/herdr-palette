id = "vjeantet.palette"
name = "Command Palette (built-ins + plugin actions)"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Command palette for herdr: built-in operations (tab/workspace/pane) AND every action of every installed plugin, in one Sublime-Text-style picker. Origin tab/pane ids are captured server-side before the popup takes focus and forwarded via --env."
platforms = ["macos", "linux"]

# Run by `herdr plugin install` after cloning: the manifest points at
# target/release/herdr-palette, which a fresh checkout does not have. herdr
# runs a build command with the manifest root as its cwd, hence the relative
# path. The script downloads the prebuilt binary published for this version
# and platform and verifies its SHA-256, falling back to
# `cargo build --release` on any miss - so a Rust toolchain is only required
# when no matching release exists (see scripts/fetch-or-build.sh).
[[build]]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

# Entry point that runs server-side (no TTY), so it just opens the popup pane.
# The action's cwd is the plugin root, so the relative path resolves.
[[actions]]
id = "open"
title = "Command palette"
contexts = ["workspace"]
command = ["target/release/herdr-palette", "open"]

# The interactive picker itself. Runs in popup placement, which has a TTY: a
# session-modal pane sized independently of the tiled layout. Without
# width/height it defaults to half the terminal, which is huge on a large
# window; cell counts below are effectively max-width/max-height, because
# herdr clamps them to the terminal size when it is smaller.
# It does not appear in `herdr pane list`, and its process does not receive
# HERDR_PANE_ID.
# Launched via $HERDR_PLUGIN_ROOT rather than a relative path because `open`
# changes --cwd to the origin pane's working directory (herdr does not expand
# variables in manifest arrays, hence the one-line bash -c). That --cwd is
# load-bearing: a RELATIVE path typed into a directory-validated input is
# checked against this process's cwd and forwarded to herdr as typed, so both
# must resolve from the origin pane's cwd. Do not "simplify" either away.
[[panes]]
id = "palette"
title = "Command palette"
placement = "popup"
width = 80
height = 24
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-palette\" ui"]

# Host pane for user-declared commands (see README, "Your own commands"). It
# exists only so `plugin pane open --entrypoint runner` has something to open:
# the argv to run arrives in PALETTE_RUN_ARGV and is spawned directly, never
# through a shell. `placement` here is just the default; the palette overrides
# it per entry with --placement. No width/height: herdr rejects both outside
# popup placement.
[[panes]]
id = "runner"
title = "User command"
placement = "split"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-palette\" run"]
