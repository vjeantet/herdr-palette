id = "vjeantet.palette"
name = "Command Palette (built-ins + plugin actions)"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "fzf command palette for herdr: built-in operations (tab/workspace/pane) AND every action of every installed plugin, in one list. Origin tab/pane ids are captured server-side before the popup takes focus and forwarded via --env."
platforms = ["macos", "linux"]

# Entry point that runs server-side (no TTY). Can't run fzf here, so it just opens the popup pane.
[[actions]]
id = "open"
title = "Command palette"
contexts = ["workspace"]
command = ["bash", "open.sh"]

# The interactive picker itself. Runs in popup placement, which has a TTY: a
# session-modal pane sized independently of the tiled layout (defaults to
# half-size; width/height are configurable here but currently left unset).
# It does not appear in `herdr pane list`, and its process does not receive
# HERDR_PANE_ID.
# Launched via $HERDR_PLUGIN_ROOT rather than a relative path because open.sh
# changes --cwd to the origin pane's working directory.
[[panes]]
id = "palette"
title = "Command palette"
placement = "popup"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/palette.sh\""]
