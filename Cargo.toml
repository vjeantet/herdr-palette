[package]
name = "herdr-palette"
version = "0.2.2"
edition = "2021"
description = "Command palette for herdr: built-in operations and every other plugin's actions, in one Sublime-Text-style picker"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
nucleo-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"

[target.'cfg(unix)'.dependencies]
# setsid() for the detached plugin-action dispatch (src/actions.rs). Already
# in the tree through crossterm; this only makes it a direct dependency.
libc = "0.2"

[profile.release]
strip = true
