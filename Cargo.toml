[package]
name = "herdr-palette"
version = "0.2.0"
edition = "2021"
description = "Command palette for herdr: built-in operations and every other plugin's actions, in one Sublime-Text-style picker"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
nucleo-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"

[profile.release]
strip = true
